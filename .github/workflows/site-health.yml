name: Hanifi Usta - haftalik canli site kontrolu

on:
  schedule:
    - cron: '23 06 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: izmir-lokma-site-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Kaynagi al
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: HTTPS, sayfalar, SEO, baglantilar ve hassas yol kontrolu
        run: node scripts/verify-live.mjs https://izmirlokmasi.com --cloudflare-baseline --check-redirects

name: Izmir Lokma security and quality
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 06 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Exact dependency install
        run: npm ci --ignore-scripts=false
      - name: Source rules
        run: npm run test:source
      - name: Validate deploy configuration
        run: npm run test:config
      - name: Production build and tests
        run: npm run test:build
      - name: Production bundle budget
        run: npm run check:bundle
      - name: Dependency vulnerability audit (fail on moderate or worse)
        run: npm run audit:full

name: Izmir Lokma security and quality
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 06 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Exact dependency install
        run: npm ci --ignore-scripts=false
      - name: Source rules
        run: npm run test:source
      - name: Validate deploy configuration
        run: npm run test:config
      - name: Production build and tests
        run: npm run test:build
      - name: Production bundle budget
        run: npm run check:bundle
      - name: Dependency vulnerability audit (fail on moderate or worse)
        run: npm run audit:full
      - name: Save page-level SEO evidence
        if: always()
        shell: bash
        run: |
          mkdir -p outputs/maintenance
          npm run audit:site -- --output outputs/maintenance 2>&1 | tee outputs/maintenance/seo.log
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: seo-maintenance-${{ github.run_id }}
          path: outputs/maintenance/
          retention-days: 30
          if-no-files-found: error

name: Hanifi Usta - haftalik canli site kontrolu

on:
  schedule:
    - cron: '23 06 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: izmir-lokma-site-health
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Kaynagi al
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: HTTPS, sayfalar, SEO, baglantilar ve hassas yol kontrolu
        shell: bash
        run: |
          mkdir -p outputs/live
          node scripts/verify-live.mjs https://izmirlokmasi.com 2>&1 | tee outputs/live/verification.log
      - name: Canli kontrol raporunu sakla
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: site-health-${{ github.run_id }}
          path: outputs/live/
          retention-days: 30

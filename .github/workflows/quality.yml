name: Izmir Lokma security and quality
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 06 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Exact dependency install
        run: npm ci --ignore-scripts=false
      - name: Source rules
        run: npm run test:source
      - name: Validate deploy configuration
        run: npm run test:config
      - name: Production build and tests
        run: npm run test:build
      - name: Production bundle budget
        run: npm run check:bundle
      - name: Dependency vulnerability audit (fail on moderate or worse)
        run: npm run audit:full
